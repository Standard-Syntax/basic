services:
  postgres:
    image: postgres:18.1-alpine@sha256:d326bec58d3de8d239df60475941522342723934a2598ae59a0281f077681462
    environment:
      POSTGRES_DB: workflow_test
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  beta-postgres:
    profiles: ["beta"]
    image: postgres:18.1-alpine@sha256:d326bec58d3de8d239df60475941522342723934a2598ae59a0281f077681462
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD_FILE: ${BETA_POSTGRES_PASSWORD_FILE:-/dev/null}
    volumes:
      - beta-postgres-data:/var/lib/postgresql
      - ${BETA_POSTGRES_CREDENTIAL_ROOT:-/tmp}:${BETA_POSTGRES_CREDENTIAL_ROOT:-/tmp}:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /run:size=8m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    stop_grace_period: 30s

  api-service:
    profiles: ["beta"]
    image: ${BETA_API_IMAGE:-scratch}
    command: ["-config", "${BETA_API_CONFIG:-/dev/null}"]
    depends_on:
      beta-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BETA_API_PORT:-8080}:8080"
    volumes:
      - ${BETA_API_CONFIG:-/dev/null}:${BETA_API_CONFIG:-/dev/null}:ro
      - ${BETA_REPOSITORY_ROOT:-/tmp}:${BETA_REPOSITORY_ROOT:-/tmp}:ro
      - ${BETA_CAS_ROOT:-/tmp}:${BETA_CAS_ROOT:-/tmp}
      - ${BETA_CONFIGURATION_ROOT:-/tmp}:${BETA_CONFIGURATION_ROOT:-/tmp}:ro
      - ${BETA_GITHUB_CREDENTIAL_FILE:-/dev/null}:${BETA_GITHUB_CREDENTIAL_FILE:-/dev/null}:ro
      - ${BETA_GIT_PUSH_CREDENTIAL_FILE:-/dev/null}:${BETA_GIT_PUSH_CREDENTIAL_FILE:-/dev/null}:ro
    healthcheck:
      test: ["CMD", "/api-service", "-healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 6s
      retries: 30
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev,mode=1777
    stop_grace_period: 20s

  workflow-service:
    profiles: ["beta"]
    image: ${BETA_WORKFLOW_IMAGE:-scratch}
    command: ["-config", "${BETA_WORKFLOW_CONFIG:-/dev/null}"]
    depends_on:
      beta-postgres:
        condition: service_healthy
    expose: ["8081"]
    group_add: ["${BETA_DOCKER_GID:-0}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BETA_WORKFLOW_CONFIG:-/dev/null}:${BETA_WORKFLOW_CONFIG:-/dev/null}:ro
      - ${BETA_REPOSITORY_ROOT:-/tmp}:${BETA_REPOSITORY_ROOT:-/tmp}
      - ${BETA_CAS_ROOT:-/tmp}:${BETA_CAS_ROOT:-/tmp}
      - ${BETA_WORKTREE_ROOT:-/tmp}:${BETA_WORKTREE_ROOT:-/tmp}
      - ${BETA_VERIFICATION_ROOT:-/tmp}:${BETA_VERIFICATION_ROOT:-/tmp}
      - ${BETA_MANIFEST_ROOT:-/tmp}:${BETA_MANIFEST_ROOT:-/tmp}:ro
      - ${BETA_PROMPT_ROOT:-/tmp}:${BETA_PROMPT_ROOT:-/tmp}:ro
      - ${BETA_CONFIGURATION_ROOT:-/tmp}:${BETA_CONFIGURATION_ROOT:-/tmp}:ro
      - ${BETA_MINIMAX_CREDENTIAL_ROOT:-/tmp}:${BETA_MINIMAX_CREDENTIAL_ROOT:-/tmp}:ro
    healthcheck:
      test: ["CMD", "/workflow-service", "-healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 2s
      timeout: 6s
      retries: 30
    read_only: true
    user: "65532:65532"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,mode=1777
    stop_grace_period: 70s

volumes:
  beta-postgres-data:
