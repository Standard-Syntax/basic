[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "harness-agents"
version = "0.2.0"
description = "Agent configuration and trusted Python project bootstrap for the kernel-driven harness"
requires-python = "==3.14.*"
dependencies = [
  "googleapis-common-protos==1.72.0",
  "grpcio-tools==1.75.1",
  "jsonschema==4.25.1",
  "rfc8785==0.1.4",
]

[project.scripts]
harness-agents = "harness_agents.cli:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.2",
  "ty==0.0.64",
]

[tool.hatch.build.targets.wheel]
packages = ["python/src/harness_agents"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
extend-exclude = ["python/src/harness_agents/_generated"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
